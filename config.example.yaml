# ╔══════════════════════════════════════════════════════════╗
# ║  Property Hunter - 検索設定                              ║
# ║                                                          ║
# ║  このファイルを編集したら保存するだけ。                      ║
# ║  Claude Code に「物件を探して」と言えば自動で探索します。    ║
# ╚══════════════════════════════════════════════════════════╝
#
# 初回: cp config.example.yaml config.yaml

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  検索条件（自分で設定する）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

取得件数: 5                     # 何件取得するか（5 / 10 / 20 など）

エリア: "東京都渋谷区"           # 探すエリア（市区町村まで）

上限価格: "2000万円"             # 予算の上限
下限価格: ""                     # 予算の下限（空欄 = なし）

最小面積: "20坪"                 # 土地面積の下限（坪 or ㎡）
最大面積: ""                     # 土地面積の上限（空欄 = なし）

駅徒歩: "15分以内"               # 駅からの徒歩分数
築年数: ""                       # 築何年以内か（空欄 = こだわらない）

除外条件: "借地権 定期借地 競売"  # 省きたい物件キーワード（スペース区切り）

追加指示: ""                     # 自由記述。例: "整形地がいい" "南向き希望"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  物件種別（探すものだけ「はい」にする）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

物件種別:
  土地:        はい              # 更地・売地
  中古一戸建て: いいえ            # 中古の一戸建て住宅

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  対象プラットフォーム（使うものだけ「はい」にする）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

platforms:
  SUUMO:       はい              # https://suumo.jp
  "HOME'S":    はい              # https://www.homes.co.jp
  at_home:     いいえ            # https://www.athome.co.jp
  不動産ジャパン: いいえ           # https://www.fudousan.or.jp

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  出力先
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

output:
  google_sheets:
    spreadsheet_id: ""
    credentials_path: "credentials.json"
  local_csv: "results/properties.csv"
